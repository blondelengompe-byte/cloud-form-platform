name: Deploy Cloud Form Platform

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,proxy,monitoring,backups"
          target: "/root/cloud-form-platform"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Début du déploiement sur le VPS ---"
            cd /root/cloud-form-platform
            
            # 1. Génération du fichier .env
            cat <<EOF > .env
            WEBAPP_URL=https://formbricks.efymotors.com
            NEXT_PUBLIC_WEBAPP_URL=https://formbricks.efymotors.com
            NEXT_PUBLIC_FORMBRICKS_API_HOST=https://formbricks.efymotors.com
            NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"
            DATABASE_URL="postgresql://postgres:EFY_Motors_2026!@db:5432/formbricks"
            POSTGRES_DB="formbricks"
            POSTGRES_USER="postgres"
            POSTGRES_PASSWORD="EFY_Motors_2026!"
            GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
            
            # Config Minio
            S3_ACCESS_KEY=admin
            S3_SECRET_KEY=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            S3_REGION=us-east-1
            S3_BUCKET_NAME=formbricks
            S3_ENDPOINT=http://minio:9000
            S3_FORCE_PATH_STYLE=1
            NEXT_PUBLIC_S3_ACCESS_KEY=admin
            NEXT_PUBLIC_S3_REGION=us-east-1
            NEXT_PUBLIC_S3_BUCKET_NAME=formbricks
            NEXT_PUBLIC_S3_ENDPOINT=https://s3.efymotors.com
            NEXT_PUBLIC_S3_FORCE_PATH_STYLE=1
            
            # Config SMTP (Gmail)
            MAIL_FROM=${{ secrets.EMAIL_USER }}
            SMTP_HOST=${{ secrets.EMAIL_HOST }}
            SMTP_PORT=${{ secrets.EMAIL_PORT }}
            SMTP_USER=${{ secrets.EMAIL_USER }}
            SMTP_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
            SMTP_SECURE_ENABLED=0
            EOF
            echo "✅ Fichier .env généré"

            # 2. Réseaux et Dossiers
            docker network create web_gateway || true
            mkdir -p uploads
            chmod -R 777 uploads

            # 3. Lancement des services
            echo "--- Lancement des conteneurs ---"
            docker compose pull
            docker compose up -d --remove-orphans

            # 4. Configuration Minio (Buckets et CORS)
            echo "--- Configuration Minio ---"
            sleep 15
            docker exec forms_grafana /bin/sh -c "
              curl -O https://dl.min.io/client/mc/release/linux-amd64/mc && \
              chmod +x mc && \
              ./mc alias set myminio https://s3.efymotors.com admin '${{ secrets.GRAFANA_ADMIN_PASSWORD }}' && \
              ./mc mb myminio/formbricks || true && \
              ./mc mb myminio/backups || true && \
              echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Resource\":[\"arn:aws:s3:::formbricks\",\"arn:aws:s3:::backups\"]},{\"Action\":[\"s3:GetObject\"],\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Resource\":[\"arn:aws:s3:::formbricks/*\",\"arn:aws:s3:::backups/*\"]}]}' > policy.json && \
              ./mc anonymous set public myminio/formbricks && \
              ./mc anonymous set public myminio/backups && \
              ./mc anonymous set-json policy.json myminio/formbricks && \
              ./mc anonymous set-json policy.json myminio/backups
            " || echo "⚠️ Config Minio manuelle nécessaire"

            # 5. Migrations Base de données
            echo "--- Migrations de la base de données ---"
            sleep 5
            # On utilise docker compose exec pour lancer les migrations Prisma
            docker compose exec -T formbricks npx prisma migrate deploy --schema packages/database/prisma/schema.prisma || echo "⚠️ Migration déjà faite"

            echo "✅ Déploiement terminé avec succès !"