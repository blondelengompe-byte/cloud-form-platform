name: Deploy Cloud Form Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push App Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/form-app:latest .
          docker push $ECR_REGISTRY/form-app:latest

      - name: Prepare VPS Environment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /root/cloud-form-platform
            cd /root/cloud-form-platform
            # Clean up old containers if they exist
            # docker compose down || true

      - name: Copy Infrastructure Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,proxy,monitoring,backups"
          target: "/root/cloud-form-platform"

      - name: Get ECR Password
        id: get-ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region eu-west-3)" >> $GITHUB_OUTPUT

      - name: Deploy and Start Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Début du déploiement sur le VPS ---"
            cd /root/cloud-form-platform

            # Generate .env file
            cat <<EOF > .env
            REGISTRY=${{ steps.login-ecr.outputs.registry }}
            DOMAIN_NAME=${{ secrets.VPS_HOST }}.nip.io
            NEXTAUTH_URL=https://${{ secrets.VPS_HOST }}.nip.io:8444
            WEBAPP_URL=https://${{ secrets.VPS_HOST }}.nip.io:8444
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            POSTGRES_USER=form_admin
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=formbricks
            DATABASE_URL=postgresql://form_admin:${{ secrets.POSTGRES_PASSWORD }}@db:5432/formbricks
            REDIS_URL=redis://redis:6379
            MODSEC_MODE=DetectionOnly
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION=eu-west-3
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF
            echo "✅ Fichier .env généré"

            # Docker Login
            echo "--- Connexion à ECR ---"
            echo "${{ steps.get-ecr-password.outputs.password }}" | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            echo "✅ Docker Login réussi"

            # SSL Bootstrap (Chicken and Egg fix)
            echo "--- Vérification des certificats SSL ---"
            CERT_PATH="/root/cloud-form-platform/certs/live/${{ secrets.VPS_HOST }}.nip.io"
            if [ ! -f "$CERT_PATH/fullchain.pem" ]; then
              echo "⚠️ Certificats manquants, génération de certificats temporaires..."
              mkdir -p "$CERT_PATH"
              openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                -keyout "$CERT_PATH/privkey.pem" \
                -out "$CERT_PATH/fullchain.pem" \
                -subj "/CN=${{ secrets.VPS_HOST }}.nip.io"
              echo "✅ Certificats temporaires générés"
            fi

            # Deployment
            echo "--- Pull des images ---"
            docker compose pull
            echo "--- Démarrage des containers ---"
            docker compose up -d --remove-orphans
            docker compose ps
            echo "✅ Déploiement terminé avec succès !"